# Manual overlay for the publication list.
#
# data/publications.json is regenerated from DBLP every night by
# .github/workflows/update-publications.yml and committed to main, so
# hand edits to it are lost on the next run. This file is the supported
# escape hatch: scripts/fetch_publications.py merges it into the DBLP
# results after the fetch and classification, before the JSON is
# written. Merged records go through the same topic and venue
# classification helpers as DBLP records, so nothing downstream (sort,
# counters, filters, renderer) knows a record came from here.
#
#   additions   full records for papers DBLP has not indexed at all
#   overrides   field patches for papers DBLP knows only as a CoRR preprint
#
# THE OVERLAY PRUNES ITSELF. Every run checks each entry against the
# live DBLP results and deletes the ones DBLP has caught up with,
# rewriting this file in place — comments and key order survive. The
# nightly workflow commits the rewrite like any other change, so the
# overlay shrinks back to empty on its own. To see what would go
# without touching the file:
#
#     python3 scripts/fetch_publications.py --no-prune
#
# Requires ruamel.yaml (scripts/requirements.txt). Without it the
# overlay is still applied, but pruning is skipped with a warning.
#
# Both sections are documented here rather than next to the data below,
# so that pruning the last entry of a section can't carry the prose off
# with it.
#
# ---------------------------------------------------------------------
# How the fields decide placement on the homepage
#
#   type        picks the TYPE tab:
#                 a_star_conf   -> "A/A* Conferences"   (CORE A or A*)
#                 q1_journal    -> "Q1 Journals"        (Scimago Q1, CS)
#                 other_conf    -> "Other Conferences & Journals"
#                 other_journal -> "Other Conferences & Journals"
#                 workshop      -> "Workshops"
#                 preprint      -> "Preprints"
#               It also tells the classifier whether to rank the venue
#               against CORE or against Scimago, so declare it for
#               anything that isn't a conference paper. Omitted, the
#               entry is classified as a conference paper from the key's
#               venue abbreviation, exactly as a DBLP record would be.
#               The "Selected" tab is computed, not set here: the 15
#               most-cited papers from top-tier venues (a_star_conf or
#               q1_journal). With 0 citations a new paper will not
#               appear there until Scholar counts come in — recency is
#               only the tie-break, not a way in.
#   topics      picks the TOPIC filter. FALLBACK ONLY: the keyword
#               patterns in data/topics.yml run first and win whenever
#               they recognise the paper; the list here is used only
#               for papers they don't (those come back as "misc").
#               Allowed slugs, exactly these:
#                 ir, recsys, llm, agents, nlp, gnn, trust, task_vectors,
#                 efficient, misinfo, data_mining, social_net, misc
#               To force topics on a paper the patterns get wrong, add
#               its key to topic_overrides in data/topics.yml — that
#               beats the patterns, which this list does not.
#   venue_short is the badge text on the card. Short and uppercase-ish,
#               matching siblings already in publications.json (SIGIR,
#               TOIS, IEEE T-AI, SEMEVAL).
#   authors     DBLP display style: first name to an initial, middle and
#               last names spelled out — "M. Sofia Bucarelli", not
#               "Maria Sofia Bucarelli". Full first names are abbreviated
#               for you, so either form is accepted.
#   year        publication year as it should sort on the page.
#   title       without the trailing period. Quote it if it contains a
#               colon followed by a space — that's YAML syntax.
#   url         defaults to url_publisher, or url_arxiv when there is no
#               publisher page. Omit it and it is derived.
#
# ---------------------------------------------------------------------
# additions — full records for papers DBLP has no entry for at all.
#
# `key` and `title` are required; every other field is optional and
# defaults the way a DBLP record would. The key is synthetic and must
# start with "manual/". Mirror the DBLP key the paper will eventually
# get — "manual/conf/<abbrev>/<slug>" or "manual/journals/<abbrev>/<slug>" —
# so that the venue abbreviation lands where the CORE and Scimago
# lookups expect it; "manual/<abbrev>/<slug>" works too. Keep it unique
# and stable, since data/citations.json is keyed by it (Scholar counts
# do reach overlay records: refresh_citations.py matches against the
# merged list).
#
# Pruning: when a DBLP record turns up with the same normalized title
# (lowercased, punctuation stripped, whitespace collapsed), DBLP wins —
# the addition is dropped from the output and deleted from this file.
#
# ---------------------------------------------------------------------
# overrides — field patches for papers DBLP knows only as a CoRR
# preprint, but that have since appeared at a real venue.
#
# Keyed by DBLP key. List ONLY the fields to replace (typically venue,
# venue_short, type, year, url_publisher); everything else is left
# alone, so url_arxiv survives and the preprint link stays on the page.
# `url` is recomputed as url_publisher or url_arxiv unless the override
# sets it explicitly. A field set to `null` is treated as "not known
# yet", not as "erase it", so a TODO placeholder can't wipe DBLP's
# value.
#
# Include `title:` even though it is not being replaced: the pruner
# needs it to recognise the DBLP record that eventually supersedes this
# entry once the CoRR key itself disappears.
#
# Pruning: the entry goes when the target key is no longer a preprint,
# or when a non-preprint DBLP record with the same normalized title
# shows up. An override pointing at a key DBLP does not have is
# reported and left alone — never a hard failure of the nightly run.
#
# ---------------------------------------------------------------------
# NOT INCLUDED, on purpose:
#
#   "Survey and Benchmark of Graph Learning under Label Noise"
#   (F. A. Wani, A. Purificato, M. Sofia Bucarelli, A. G. Di Francesco,
#   M. Corelli, et al.) — Google Scholar lists no venue for it at all.
#   Add it once the venue is known.
#
#   "Variational Inference of Parameters in Opinion Dynamics Models",
#   IEEE Trans. Comput. Soc. Syst. 2026 (doi 10.1109/TCSS.2025.3640692).
#   The journal version is real, but conf/icwsm/LentiSM25 already carries
#   the identical title, so title-based pruning would drop this addition
#   on its first run. It will appear by itself once DBLP indexes the
#   TCSS record.
#
#   "TSMO 2026: Two-sided Marketplace Optimization ..." — the TSMO
#   editions are workshop-organizing entries, not papers, and
#   skip_title_patterns in data/venues.yml drops them from the DBLP sync
#   (it names "TSMO 2024: ..." as its example). No TSMO record of any
#   year is on the site; forcing 2026 in would be the odd one out.
# ---------------------------------------------------------------------

