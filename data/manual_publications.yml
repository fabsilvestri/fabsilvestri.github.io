  # NeurIPS 2025 Mech Interp workshop page under a different id.
  - key: manual/conf/iclr/CasoFMSS26
    title: Composable Sparse Subnetworks via Maximum-Entropy Principle
    authors: ["F. Caso", "S. Fonio", "S. Monaco", "N. Saccomanno", "F. Silvestri"]
    year: 2026
    venue: ICLR
    venue_short: ICLR
    url_publisher: https://openreview.net/forum?id=IHwx5ioIP2
    type: a_star_conf
    topics: ["efficient"]
    citations: 0

  # IEEE FLTA 2025 (3rd Int. Conf. on Federated Learning Technologies and
  # Applications). Found by diffing the Google Scholar profile against
  # the site while dblp.org was closed to automated clients; doi, venue
  # and author list verified via CrossRef. FLTA is not in CORE, so
  # other_conf. The keyword patterns match nothing here, so the topic
  # below is the overlay's fallback.
  - key: manual/conf/flta/AvellaS25
    title: "Eco-Friendly Federated Learning: Designing a FinOps Framework for Multicloud Resource Coordination"
    authors: ["F. Avella", "F. Silvestri"]
    year: 2025
    venue: FLTA
    venue_short: FLTA
    url_publisher: https://doi.org/10.1109/flta67013.2025.11336369
    type: other_conf
    topics: ["efficient"]
    citations: 2

  # CORE2023 ranks AISTATS A, which classifies as a_star_conf. Venue and
